function buildSpatial(){const root=document.getElementById('a-spatials');root.innerHTML=D.spatialOrder.map(k=>{const x=D.spatials[k];return `<button class="spick ${state.s===k?'active':''}" data-k="${k}"><span class="spatial-icon">${x.icon}</span><span><strong>${A.spatialName(k)}</strong><small>${A.lang==='fr'?x.frHint:x.enHint}</small></span></button>`}).join('');root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{state.s=b.dataset.k;render()})}
function hit(){const el=document.getElementById('a-hit');if(!state.aniimo){el.classList.remove('show');el.innerHTML='';return}el.classList.add('show');el.innerHTML=`<div><div class="aniimo-id">#${A.esc(state.aniimo.id)} · ${A.esc(state.aniimo.role)}</div><div class="aniimo-name">${A.esc(A.nameOf(state.aniimo))}</div></div><div class="element-pills">${A.pills(state.aniimo.elements)}</div>`}
function render(){buildPicker();buildSpatial();hit();document.getElementById('a-summary').innerHTML=`<div class="summary-left"><strong>${state.aniimo?A.esc(A.nameOf(state.aniimo)):A.t('manual')}</strong>${A.pills(state.es)}</div><div class="summary-spatial">${D.spatials[state.s].icon} ${A.spatialName(state.s)}</div>`;document.getElementById('a-context').textContent=`${state.es.map(A.elementName).join(' + ')} · ${A.spatialName(state.s)}`;const targets=[];for(const e of D.elementOrder)for(const s of D.spatialOrder){const em=Math.max(...state.es.map(a=>M.eMult(a,e))),sm=M.sMult(state.s,s);targets.push({e,s,em,sm,total:em*sm})}const perfect=targets.filter(x=>x.em>1.001&&x.sm===2);document.getElementById('a-perfect-count').textContent=perfect.length;document.getElementById('a-perfect').innerHTML=perfect.length?perfect.map(x=>globalRow([x.e],x.s,A.t('perfect'),'good')).join(''):empty(A.t('noPerfect'));const eff=D.elementOrder.map(e=>({e,score:Math.max(...state.es.map(a=>M.eMult(a,e)))})).filter(x=>x.score>1.001).sort((a,b)=>b.score-a.score);document.getElementById('a-effective-count').textContent=eff.length;document.getElementById('a-effective').innerHTML=eff.length?eff.map(x=>`<div class="row"><div class="row-left">${A.iconGroup([x.e])}<div><div class="row-name">${A.elementName(x.e)}</div><div class="row-meta">${A.t('advantageOff')}</div></div></div><span class="tag good">${A.t('superEffective')}</span></div>`).join(''):empty(A.t('noElementAdv'));const dangers=[];for(const e of D.elementOrder)for(const s of D.spatialOrder){const incoming=M.incomingThreatScore(state.es,e),sp=M.sMult(s,state.s),myOff=Math.max(...state.es.map(a=>M.eMult(a,e)));let danger=0;if(incoming>1.001)danger+=2;if(incoming>2.3)danger+=2;if(sp===2)danger++;if(myOff<.999)danger++;if(danger>=3)dangers.push({e,s,incoming,sp,myOff,danger})}dangers.sort((a,b)=>b.danger-a.danger||b.incoming-a.incoming);document.getElementById('a-danger-count').textContent=dangers.length;document.getElementById('a-danger').innerHTML=dangers.length?dangers.slice(0,14).map(x=>globalRow([x.e],x.s,x.danger>=5?A.t('dangerMax'):A.t('toAvoid'),'bad',`${M.scoreLabel(x.incoming)} ${A.t('received')}${x.sp===2?' + '+A.t('spatialEnemy'):''}`)).join(''):empty(A.t('noDanger'));const threats=[...new Set(dangers.map(x=>x.e))],duo=D.elementOrder.filter(e=>!state.es.includes(e)).map(e=>({e,coverage:threats.reduce((n,tg)=>n+(M.eMult(e,tg)>1.001?1:0),0),safe:threats.reduce((n,tg)=>n+(M.eMult(tg,e)<.999?1:0),0)})).sort((a,b)=>b.coverage-a.coverage||b.safe-a.safe);document.getElementById('a-duo').innerHTML=duo.length?`<div class="duohero"><div class="element-pills">${A.pills([duo[0].e])}</div><strong>${A.elementName(duo[0].e)}</strong><p>${A.t('covers',duo[0].coverage)}</p></div>`:empty(A.t('notEnough'))}
const input=document.getElementById('a-search');A.autocomplete(input,a=>{state.aniimo=a;state.es=[...a.elements];render()},{openEmpty:false});input.addEventListener('change',()=>{const a=A.exactAniimo(input.value);if(a){state.aniimo=a;state.es=[...a.elements];render()}});document.getElementById('a-clear').onclick=()=>{input.value='';state.aniimo=null;render()};render();})();

</script><script>
/* ---- team.js ---- */
(function(){'use strict';const A=window.AML,D=A.data,M=window.AML_MATCH;let favorites=[];const empty=x=>`<div class="empty">${x}</div>`;
function updateFavorites(){document.getElementById('fav-limit').textContent=`${favorites.length} / 3`;document.getElementById('favchips').innerHTML=favorites.length?favorites.map(k=>{const a=D.aniimos.find(x=>x.key===k);return `<div class="favchip">${A.iconGroup(a.elements,'sm')}<div><strong>${A.esc(A.nameOf(a))}</strong><div class="row-meta">${A.esc(a.role)}</div></div><button data-remove="${a.key}" aria-label="Remove">×</button></div>`}).join(''):empty(A.t('selectFavorite'));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{favorites=favorites.filter(x=>x!==b.dataset.remove);updateFavorites()});renderTeams()}
function add(a){if(!a)return;if(favorites.includes(a.key)){document.getElementById('team-search').value='';return}if(favorites.length>=3){document.getElementById('team-notice').innerHTML=`<div class="notice">${A.t('maxFavorites')}</div>`;return}favorites.push(a.key);document.getElementById('team-search').value='';updateFavorites()}
function teamScore(team,useRoles){let score=0,coverage=0;for(const d of D.elementOrder){let best=1;for(const a of team)best=Math.max(best,M.bestOffenseScore(a.elements,[d]));if(best>1.001){coverage++;score+=12}else score+=2}score+=new Set(team.flatMap(a=>a.elements)).size*3;for(const incoming of D.elementOrder){let weakN=0,resN=0;for(const a of team){const v=M.defenseElementScore(incoming,a.elements);if(v>1.001)weakN++;else if(v<.999)resN++}if(weakN>=3)score-=10+(weakN-3)*6;if(resN>=2)score+=2}let roleOk=true;if(useRoles){const rs=team.map(a=>a.role),hasD=rs.includes('DPS'),hasB=rs.includes('BREAK'),hasS=rs.some(r=>['SUPPORT','HEAL','REGEN','TANK'].includes(r));score+=(hasD?28:-32)+(hasB?28:-32)+(hasS?16:-8)+new Set(rs).size*3;roleOk=hasD&&hasB}return {score,coverage,roleOk}}
function combinations(arr,k,cb,start=0,pick=[]){if(k===0){cb(pick);return}for(let i=start;i<=arr.length-k;i++){pick.push(arr[i]);combinations(arr,k-1,cb,i+1,pick);pick.pop()}}
function teamCard(r,rank,useRoles){return `<div class="teamcard"><div class="teamtop"><strong>${A.t('suggestion',rank)}</strong><div class="teammeta">${A.t('coverage',r.coverage)}</div></div><div class="team-members">${r.team.map(a=>`<div class="member ${favorites.includes(a.key)?'favorite':''}">${favorites.includes(a.key)?'<span class="star">★</span>':''}<div class="member-icons">${a.elements.map(e=>A.iconSvg(e,'sm')).join('')}</div><div class="member-name" title="${A.esc(A.nameOf(a))}">${A.esc(A.nameOf(a))}</div><div class="member-role">${A.esc(a.role)}</div></div>`).join('')}</div><div class="coverage"><span class="metric">${A.t('coverage',r.coverage)}</span>${useRoles?`<span class="metric">${r.roleOk?A.t('rolesOk'):A.t('rolesPartial')}</span>`:''}</div></div>`}
function renderTeams(){const results=document.getElementById('team-results'),notice=document.getElementById('team-notice');notice.innerHTML='';results.innerHTML='';const favs=favorites.map(k=>D.aniimos.find(a=>a.key===k)).filter(Boolean),ownedOnly=document.getElementById('owned-only').checked,useRoles=document.getElementById('use-roles').checked;document.getElementById('team-context').textContent=`${favs.length}/3 · ${ownedOnly?A.t('ownedOnly'):A.t('teamSize')}`;if(!favs.length){notice.innerHTML=`<div class="notice">${A.t('selectFavorite')}</div>`;return}if(ownedOnly&&favs.some(a=>!A.owned.has(a.key))){notice.innerHTML=`<div class="notice">${A.t('favoriteNotOwned')}</div>`;return}const pool=D.aniimos.filter(a=>!favorites.includes(a.key)&&(!ownedOnly||A.owned.has(a.key)));if(pool.length+favs.length<4){notice.innerHTML=`<div class="notice">${A.t('needFour')}</div>`;return}const needed=4-favs.length,best=[];combinations(pool,needed,extra=>{const team=[...favs,...extra],m=teamScore(team,useRoles),item={team,...m};let pos=best.findIndex(x=>item.score>x.score);if(pos<0)pos=best.length;best.splice(pos,0,item);if(best.length>8)best.pop()});results.innerHTML=best.length?best.map((r,i)=>teamCard(r,i+1,useRoles)).join(''):`<div class="notice">${A.t('noTeam')}</div>`}
const input=document.getElementById('team-search');let pending=null;A.autocomplete(input,a=>{pending=a;add(a)},{openEmpty:false});input.addEventListener('input',()=>pending=null);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&pending){e.preventDefault();add(pending)}});document.getElementById('team-add').onclick=()=>add(A.exactAniimo(input.value));document.getElementById('owned-only').onchange=renderTeams;document.getElementById('use-roles').onchange=renderTeams;document.addEventListener('aml:collection-changed',renderTeams);updateFavorites();})();

</script><script>
/* ---- collection.js ---- */
(function(){'use strict';const A=window.AML,D=A.data;
function filters(){const es=document.getElementById('collection-element'),rs=document.getElementById('collection-role');es.innerHTML=`<option value="">${A.t('allElements')}</option>`+D.elementOrder.map(e=>`<option value="${e}">${A.elementName(e)}</option>`).join('');const roles=[...new Set(D.aniimos.map(a=>a.role))].sort();rs.innerHTML=`<option value="">${A.t('allRoles')}</option>`+roles.map(r=>`<option value="${A.esc(r)}">${A.esc(r)}</option>`).join('')}
function updateCode(){document.getElementById('reference-code').value=A.referenceCode();document.getElementById('copy-status').textContent=''}
function render(){const q=document.getElementById('collection-search').value.trim().toLocaleLowerCase(A.lang),ef=document.getElementById('collection-element').value,rf=document.getElementById('collection-role').value;const list=D.aniimos.filter(a=>(!q||A.nameOf(a).toLocaleLowerCase(A.lang).includes(q)||a.id.includes(q))&&(!ef||a.elements.includes(ef))&&(!rf||a.role===rf));document.getElementById('collection-grid').innerHTML=list.map(a=>`<button class="ani-card ${A.owned.has(a.key)?'owned':''}" data-key="${a.key}">${A.owned.has(a.key)?'<span class="ownedmark">✓</span>':''}<div class="ani-card-head"><div>${A.iconGroup(a.elements,'md')}</div><div style="min-width:0"><div class="ani-card-name">${A.esc(A.nameOf(a))}</div><div class="ani-card-id">#${A.esc(a.id)}</div></div></div><div class="ani-card-bottom"><div class="element-pills">${a.elements.map(e=>`<span class="element-pill">${A.elementName(e)}</span>`).join('')}</div><span class="rolebadge">${A.esc(a.role)}</span></div></button>`).join('')||`<div class="empty">${A.t('noCandidate')}</div>`;document.querySelectorAll('.ani-card').forEach(b=>b.onclick=()=>{const k=b.dataset.key;if(A.owned.has(k))A.owned.delete(k);else A.owned.add(k);A.saveOwned();render()});const n=A.owned.size;document.getElementById('collection-badge').textContent=`${n} / ${D.aniimos.length}`;document.getElementById('collection-count').textContent=A.t('collectionCounter',n);updateCode()}
async function copyCode(){const value=document.getElementById('reference-code').value,status=document.getElementById('copy-status');try{await navigator.clipboard.writeText(value);status.textContent=A.t('copied')}catch{const el=document.getElementById('reference-code');el.focus();el.select();try{document.execCommand('copy');status.textContent=A.t('copied')}catch{status.textContent=value}}}
function restore(){const raw=document.getElementById('restore-code').value,set=A.decodeReference(raw),status=document.getElementById('restore-status');status.classList.remove('error');if(!set){status.textContent=A.t('restoreInvalid');status.classList.add('error');return}if(A.owned.size&& !confirm(A.t('restoreConfirm')))return;A.replaceOwned(set);status.textContent=A.t('restoreSuccess',set.size);render()}
filters();document.getElementById('collection-search').oninput=render;document.getElementById('collection-element').onchange=render;document.getElementById('collection-role').onchange=render;document.getElementById('collection-reset').onclick=()=>{document.getElementById('collection-search').value='';document.getElementById('collection-element').value='';document.getElementById('collection-role').value='';render()};document.getElementById('collection-clear').onclick=()=>{A.owned.clear();A.saveOwned();render()};document.getElementById('copy-code').onclick=copyCode;document.getElementById('restore-button').onclick=restore;document.getElementById('restore-code').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();restore()}});document.addEventListener('aml:collection-changed',updateCode);render();})();

</script><script>
/* ---- standalone router ---- */

(function(){'use strict';
const valid=['weakness','analyse','team','collection'];
const titleKeys={weakness:'pageWeakTitle',analyse:'pageAnalyseTitle',team:'pageTeamTitle',collection:'pageCollectionTitle'};
function currentRoute(){const r=location.hash.replace(/^#/,'');return valid.includes(r)?r:'weakness'}
function show(route,writeHash=false){if(!valid.includes(route))route='weakness';document.querySelectorAll('.app-route').forEach(el=>el.classList.toggle('route-active',el.dataset.route===route));const links=[...document.querySelectorAll('#sidebar .nav a')];links.forEach((a,i)=>{const r=valid[i];a.href='#'+r;a.classList.toggle('active',r===route);a.onclick=e=>{e.preventDefault();if(location.hash!=='#'+r)location.hash=r;else show(r)}});if(window.AML){const key=titleKeys[route];if(key)document.title=window.AML.t(key)}if(writeHash&&location.hash!=='#'+route)history.replaceState(null,'','#'+route);window.scrollTo({top:0,behavior:'instant'})}
window.addEventListener('hashchange',()=>show(currentRoute()));show(currentRoute(),!location.hash);
})();
